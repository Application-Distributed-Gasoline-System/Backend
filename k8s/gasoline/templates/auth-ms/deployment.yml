apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: auth-ms
  name: auth-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-ms
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: auth-ms
    spec:
      containers:
      - image: southamerica-west1-docker.pkg.dev/ape-3-auth/image-registry/auth-ms
        name: auth-ms
        env:
        - name: PORT
          value: "5002"
        - name: HOST
          value: "0.0.0.0"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: gasoline-secrets
              key: JWT_SECRET
        - name: JWT_EXPIRES_IN
          value: "3600"
        - name: REFRESH_TOKEN_EXPIRES_DAYS
          value: "30"
        - name: RESET_TOKEN_EXPIRES_HOURS
          value: "1"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: gasoline-secrets
              key: AUTH_DATABASE_URL
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: gasoline-secrets
              key: SMTP_USER
        - name: SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: gasoline-secrets
              key: SMTP_PASS
        - name: SENDER_EMAIL
          valueFrom:
            secretKeyRef:
              name: gasoline-secrets
              key: SENDER_EMAIL
        - name: NODE_ENV
          value: "development"
        - name: NATS_SERVERS
          value: "nats://nats"
        resources: {}
status: {}
