networks:
  drivers-net:
  vehicles-net:
  auth-net:
  routes-net:
  fuel-net:
  monitoring-net:
services:
  nats-server:
    image: nats:latest
    ports:
      - "4222:4222"
    networks:
      - drivers-net
      - vehicles-net
      - auth-net
      - routes-net
      - fuel-net

  api-gateway:
    build: ./api-gateway
    ports:
      - "4000:4000"
    volumes:
      - ./api-gateway/src:/usr/src/app/src
      - ./proto:/usr/src/app/proto
    command: npm run start:dev
    environment:
      - PORT=4000
      - DRIVERS_MICROSERVICE_HOST=drivers-ms
      - DRIVERS_MICROSERVICE_PORT=5000
      - VEHICLES_MICROSERVICE_HOST=vehicles-ms
      - VEHICLES_MICROSERVICE_PORT=5001
      - AUTH_MICROSERVICE_HOST=auth-ms
      - AUTH_MICROSERVICE_PORT=5002 
      - ROUTES_MICROSERVICE_HOST=routes-ms
      - ROUTES_MICROSERVICE_PORT=5003 
      - FUEL_MICROSERVICE_HOST=fuel-ms
      - FUEL_MICROSERVICE_PORT=5004 
    depends_on:
      - drivers-ms
      - vehicles-ms
      - auth-ms
      - routes-ms
      - fuel-ms
    networks:
      - drivers-net
      - vehicles-net
      - auth-net
      - routes-net
      - fuel-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

  drivers-ms:
    build: ./drivers-ms
    volumes:
      - ./drivers-ms/src:/usr/src/app/src
      - ./proto:/usr/src/proto
    command: npm run start:dev
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - DATABASE_URL=${DRIVERS_DATABASE_URL:?Define DRIVERS_DATABASE_URL en el archivo .env}
      - NATS_SERVERS=nats://nats-server:4222
    depends_on:
      - nats-server
    ports:
      - "5000:5000"
      - "9103:9103"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9103/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    networks:
      - drivers-net

  vehicles-ms:
    build: ./vehicles-ms
    volumes:
      - ./vehicles-ms/src:/usr/src/app/src
      - ./proto:/usr/src/app/proto
    command: npm run start:dev
    environment:
      - PORT=5001
      - HOST=0.0.0.0
      - DATABASE_URL=${VEHICLES_DATABASE_URL:?Define VEHICLES_DATABASE_URL en el archivo .env}
      - READ_REPLICA_URL=${VEHICLES_READ_REPLICA_URL:?Define VEHICLES_READ_REPLICA_URL en el archivo .env}
      - NATS_SERVERS=nats://nats-server:4222
    ports:
      - "5001:5001"
      - "9104:9104"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9104/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    networks:
      - vehicles-net

  auth-ms:
    build: ./auth-ms
    volumes:
      - ./auth-ms/src:/usr/src/app/src
      - ./proto:/usr/src/proto
    command: npm run start:dev
    environment:
      - PORT=5002
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
      - JWT_EXPIRES_IN=3600
      - REFRESH_TOKEN_EXPIRES_DAYS=30
      - RESET_TOKEN_EXPIRES_HOURS=1
      - DATABASE_URL=${AUTH_DATABASE_URL:?Define AUTH_DATABASE_URL en el archivo .env}
      - SMTP_USER=${SMTP_USER:?Define SMTP_USER en el archivo .env}
      - SMTP_PASS=${SMTP_PASS:?Define SMTP_PASS en el archivo .env}
      - SENDER_EMAIL=${SENDER_EMAIL:?Define SENDER_EMAIL en el archivo .env}
      - NODE_ENV=development
      - NATS_SERVERS=nats://nats-server:4222
    depends_on:
      - nats-server
    ports:
      - "5002:5002"
      - "9102:9102"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9102/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    networks:
      - auth-net
  routes-ms:
    build: ./routes-ms
    volumes:
      - ./routes-ms/src:/usr/src/app/src
      - ./proto:/usr/src/proto
    command: npm run start:dev
    environment:
      - PORT=5003
      - HOST=0.0.0.0
      - DATABASE_URL=${ROUTES_DATABASE_URL:?Define ROUTES_DATABASE_URL en el archivo .env}
      - NATS_SERVERS=nats://nats-server:4222
    depends_on:
      - nats-server
    ports:
      - "5003:5003"
      - "9105:9105"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9105/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    networks:
      - routes-net

  fuel-ms:
    build: ./fuel-ms
    volumes:
      - ./fuel-ms/src:/usr/src/app/src
      - ./proto:/usr/src/proto
    command: npm run start:dev
    environment:
      - PORT=5004
      - HOST=0.0.0.0
      - DATABASE_URL=${FUEL_DATABASE_URL:?Define FUEL_DATABASE_URL en el archivo .env}
      - NATS_SERVERS=nats://nats-server:4222
      - FUEL_ANOMALY_THRESHOLD=30
    depends_on:
      - nats-server
    ports:
      - "5004:5004"
      - "9106:9106"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9106/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    networks:
      - fuel-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - drivers-ms
      - vehicles-ms
      - auth-ms
      - routes-ms
      - fuel-ms
    networks:
      - drivers-net
      - vehicles-net
      - auth-net
      - routes-net
      - fuel-net
      - monitoring-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD en el archivo .env}
    networks:
      - monitoring-net

  autoheal:
    image: willfarrell/autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock